version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fpl-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fpl_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fpl-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fpl-api
    environment:
      NODE_ENV: production
      PORT: 3016
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: fpl_db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
    ports:
      - "3016:3016"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - fpl-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3016/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  fpl-network:
    driver: bridge